services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  migrations:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  ml-vision-service:
    build:
      context: ./ml-vision-service
    env_file:
      - .env
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-in-local-dev}
      BG_MODEL_PATH: /app/models/background_removal_model.keras
      CLASSIFIER_MODEL_PATH: /app/models/wardrobe_classifier.keras
      CLASSIFIER_ARTIFACTS_DIR: /app/models/classifier_artifacts
      CLASSIFIER_ENABLE_STUB: "false"
      CLASSIFIER_IMG_SIZE: "320"
      CLASSIFIER_TOP_K: "3"
      CLASSIFIER_USE_CUTOUT: "true"
    ports:
      - "8001:8001"

  backend:
    build:
      context: ./backend
    command: bash -c "uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      ML_VISION_SERVICE_URL: http://ml-vision-service:8001
      ML_CATALOG_SERVICE_URL: http://ml-catalog-service:8002
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-in-local-dev}
    ports:
      - "8000:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
      ml-vision-service:
        condition: service_started

  celery-worker:
    build:
      context: ./backend
    command:
      - /app/.venv/bin/python
      - -m
      - celery
      - -A
      - app.tasks.celery_app:celery_app
      - worker
      - --loglevel=info
      - --concurrency=1
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      ML_VISION_SERVICE_URL: http://ml-vision-service:8001
      ML_CATALOG_SERVICE_URL: http://ml-catalog-service:8002
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-change-me-in-local-dev}
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_started
      ml-vision-service:
        condition: service_started

  # pgadmin:
  #   container_name: pgadmin
