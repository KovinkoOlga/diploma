[project]
name = "ml-catalog-service"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "accelerate>=1.8.1",
  "diffusers>=0.34.0",
  "fastapi>=0.115.0",
  "pillow>=10.4.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "safetensors>=0.5.0",
  "torch>=2.7.1",
  "torchvision>=0.22.1",
  "transformers>=4.53.1",
  "tryoffdiff @ git+https://github.com/rizavelioglu/tryoffdiff.git@562af8ea4d4850513ebd7df4f9888e54d3fc6748",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
